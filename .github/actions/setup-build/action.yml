name: BrowseFork build tools
description: Install the pinned Node/Rust toolchains and restore dependency caches.
inputs:
  targets:
    description: Space-separated Rust targets, in addition to the host target.
    required: false
    default: ''
  cache-name:
    description: Separate caches for builds with different target sets.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
    - name: Install Rust
      shell: bash
      env:
        BUILD_RUST_TARGETS: ${{ inputs.targets }}
        BUILD_RUST_TOOLCHAIN: '1.97.1'
      run: |
        rustup toolchain install "$BUILD_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
        rustup default "$BUILD_RUST_TOOLCHAIN"
        if [[ -n "$BUILD_RUST_TARGETS" ]]; then
          read -r -a targets <<< "$BUILD_RUST_TARGETS"
          rustup target add --toolchain "$BUILD_RUST_TOOLCHAIN" "${targets[@]}"
        fi
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/debug
          target/release
          target/aarch64-linux-android
          target/x86_64-linux-android
          target/aarch64-apple-darwin
          target/x86_64-apple-darwin
          target/x86_64-pc-windows-msvc
        key: rust-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ inputs.cache-name }}-${{ hashFiles('Cargo.lock') }}
    - name: Install npm dependencies
      shell: bash
      run: npm ci
