[package]
name = "tauri-plugin-browsefork-android"
version = "0.1.0"
authors = [ "BrowseFork" ]
description = "Native Android link delivery and browser integration for BrowseFork"
edition.workspace = true
publish = false
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-browsefork-android"

[dependencies]
tauri = { version = "2.12.0" }
serde = "1"
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.0", features = ["build"] }
