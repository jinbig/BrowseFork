[package]
name = "browsefork"
version = "0.1.0"
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
browsefork-core = { path = "../crates/browsefork-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
